# Mounts the VPS capability: host inventory, model tools, SSH terminal backend,
# and the server panel in the right sidebar. Tunables are documented in README.
- insert:
    - id: vps
      name: '@sunrise/dsh-vps'
      config:
        maxOutputBytes: 65536
        defaultTimeoutMs: 30000
        maxTimeoutMs: 600000
        tunnelAllowPublic: false
        guardDangerous: true
        metricsIntervalMs: 30000
        alertThresholds:
          memPct: 90
          diskPct: 90
          cpuPct: 200
