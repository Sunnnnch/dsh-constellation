<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: radial-gradient(900px 520px at 50% 18%, #1a2540 0%, #0b0f16 62%), #0b0f16;
    color: #e8ecf4;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .stars { position: absolute; inset: 0; opacity: .3; }
  .stars span { position: absolute; background: #cfe0ff; border-radius: 50%; }
  .logo { width: 132px; height: 132px; margin-bottom: 30px; filter: drop-shadow(0 24px 60px rgba(90,130,255,.45)); }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .sub { margin-top: 18px; font-size: 23px; color: #9aa7bd; letter-spacing: .01em; }
  .sub b { color: #cfe0ff; font-weight: 600; }
  .rule { width: 64px; height: 2px; background: #34456b; margin: 34px 0 26px; border-radius: 2px; }
  .repo { font-family: ui-monospace, Consolas, monospace; font-size: 16px; color: #8fa8d9; letter-spacing: .01em; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="16" fill="#111827"/>
    <g stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".55" fill="none">
      <path d="M10 42L22.4 21.6L34.4 34.4L44.8 15.2"/>
      <path d="M34.4 34.4L54.4 32.8"/>
      <path d="M34.4 34.4L36.4 52.8"/>
    </g>
    <g fill="#f9fafb">
      <circle cx="10" cy="42" r="4.2"/><circle cx="22.4" cy="21.6" r="4.2"/>
      <circle cx="34.4" cy="34.4" r="5.4"/><circle cx="44.8" cy="15.2" r="4.2"/>
      <circle cx="54.4" cy="32.8" r="4.2"/><circle cx="36.4" cy="52.8" r="4.2"/>
    </g>
  </svg>

  <h1>Constellation</h1>
  <div class="sub">给 <b>DeepSeek Harness</b> 的服务器管理插件</div>
  <div class="rule"></div>
  <div class="repo">github.com/Sunnnnch/dsh-constellation</div>

<script>
  const wrap = document.getElementById('stars');
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i += 1) {
    const s = document.createElement('span');
    const size = rnd() * 1.8 + 0.8;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (rnd() * 100) + '%';
    s.style.top = (rnd() * 100) + '%';
    s.style.opacity = (rnd() * 0.55 + 0.1).toFixed(2);
    wrap.appendChild(s);
  }
</script>
</body>
</html>
